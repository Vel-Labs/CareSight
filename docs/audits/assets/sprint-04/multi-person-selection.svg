<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Multi-person floor candidate reference">
  <rect width="960" height="540" fill="#f7f7f2"/>
  <rect y="360" width="960" height="180" fill="#dce8d5"/>
  <text x="32" y="48" font-family="Arial, sans-serif" font-size="26" fill="#1f2933">multi-person selection</text>
  <text x="32" y="82" font-family="Arial, sans-serif" font-size="18" fill="#46515f">Standing person is not selected when a lower posture floor-zone candidate exists.</text>
  <rect x="185" y="150" width="92" height="295" rx="8" fill="none" stroke="#64748b" stroke-width="6"/>
  <text x="145" y="480" font-family="Arial, sans-serif" font-size="18" fill="#1f2933">standing, ignored</text>
  <rect x="500" y="382" width="310" height="72" rx="8" fill="none" stroke="#2563eb" stroke-width="6"/>
  <circle cx="586" cy="416" r="20" fill="#2563eb" opacity="0.22"/>
  <text x="514" y="488" font-family="Arial, sans-serif" font-size="18" fill="#1f2933">selected floor candidate</text>
</svg>
