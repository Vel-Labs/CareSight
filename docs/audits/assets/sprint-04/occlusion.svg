<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Occlusion reference">
  <rect width="960" height="540" fill="#f7f7f2"/>
  <text x="32" y="48" font-family="Arial, sans-serif" font-size="26" fill="#1f2933">occlusion grace vs reset</text>
  <text x="32" y="82" font-family="Arial, sans-serif" font-size="18" fill="#46515f">Seen, briefly missing, then seen again. Long missing intervals reset dwell.</text>
  <g transform="translate(70 145)">
    <rect width="230" height="250" fill="#ffffff" stroke="#cbd5e1"/>
    <rect y="165" width="230" height="85" fill="#dce8d5"/>
    <rect x="48" y="176" width="134" height="44" rx="6" fill="none" stroke="#2563eb" stroke-width="5"/>
    <text x="72" y="232" font-family="Arial, sans-serif" font-size="16" fill="#1f2933">seen</text>
  </g>
  <g transform="translate(365 145)">
    <rect width="230" height="250" fill="#ffffff" stroke="#cbd5e1"/>
    <rect y="165" width="230" height="85" fill="#dce8d5"/>
    <rect x="65" y="85" width="100" height="115" fill="#94a3b8" opacity="0.28"/>
    <text x="55" y="232" font-family="Arial, sans-serif" font-size="16" fill="#1f2933">temporarily missing</text>
  </g>
  <g transform="translate(660 145)">
    <rect width="230" height="250" fill="#ffffff" stroke="#cbd5e1"/>
    <rect y="165" width="230" height="85" fill="#dce8d5"/>
    <rect x="52" y="178" width="130" height="42" rx="6" fill="none" stroke="#2563eb" stroke-width="5"/>
    <text x="68" y="232" font-family="Arial, sans-serif" font-size="16" fill="#1f2933">seen again</text>
  </g>
</svg>
