<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CareSight local caregiver awareness loop</title>
  <desc id="desc">An animated local-first care loop: a resident has a possible floor-stay, human review completes, a caregiver phone shows help is on the way, and a helper assists the resident up.</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.58" stop-color="#eef7f3"/>
      <stop offset="1" stop-color="#fff8ef"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="1">
      <stop offset="0" stop-color="#d8eee5"/>
      <stop offset="1" stop-color="#f3dfc8"/>
    </linearGradient>
    <linearGradient id="care" x1="0" x2="1">
      <stop offset="0" stop-color="#2a7f76"/>
      <stop offset="1" stop-color="#5269b0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1d2b3a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#5269b0"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#wall)"/>
  <rect x="0" y="258" width="1200" height="102" fill="url(#floor)"/>
  <path d="M80 258 C230 232 340 282 492 252 C640 222 768 278 920 250 C1028 230 1102 236 1160 252" fill="none" stroke="#c5ddd3" stroke-width="4"/>

  <g opacity="0.58">
    <rect x="70" y="70" width="142" height="92" rx="10" fill="#ffffff" stroke="#d6e4e8"/>
    <rect x="89" y="88" width="104" height="58" rx="6" fill="#eaf4f1"/>
    <path d="M98 134 L124 116 L145 128 L172 98 L185 112" fill="none" stroke="#2a7f76" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="172" cy="98" r="5" fill="#e36f4d"/>
  </g>

  <text x="68" y="43" fill="#143237" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700">CareSight Hub</text>
  <text x="420" y="52" fill="#365056" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">local perception -> bounded event -> human review -> caregiver handoff</text>

  <g id="resident-scene" filter="url(#soft-shadow)">
    <rect x="178" y="276" width="270" height="16" rx="8" fill="#8bb9aa" opacity="0.55"/>

    <g id="resident-standing" opacity="1">
      <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite" keyTimes="0;0.19;0.28;1" values="1;1;0;0"/>
      <ellipse cx="280" cy="134" rx="18" ry="21" fill="#6f4b3e"/>
      <circle cx="280" cy="142" r="20" fill="#b97862"/>
      <path d="M261 134 C266 113 292 111 300 133 C291 123 273 122 261 134" fill="#4b302b"/>
      <path d="M280 164 C270 181 270 207 280 224 C291 207 291 181 280 164" fill="#5269b0"/>
      <path d="M272 181 L237 211" stroke="#2b3e46" stroke-width="12" stroke-linecap="round"/>
      <path d="M288 181 L323 211" stroke="#2b3e46" stroke-width="12" stroke-linecap="round"/>
      <path d="M276 222 L249 267" stroke="#2b3e46" stroke-width="13" stroke-linecap="round"/>
      <path d="M284 222 L324 264" stroke="#2b3e46" stroke-width="13" stroke-linecap="round"/>
    </g>

    <g id="resident-falling" opacity="0" transform="translate(12 4) rotate(34 280 220)">
      <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite" keyTimes="0;0.18;0.28;0.39;1" values="0;0;1;0;0"/>
      <ellipse cx="280" cy="134" rx="18" ry="21" fill="#6f4b3e"/>
      <circle cx="280" cy="142" r="20" fill="#b97862"/>
      <path d="M261 134 C266 113 292 111 300 133 C291 123 273 122 261 134" fill="#4b302b"/>
      <path d="M280 164 C270 181 270 207 280 224 C291 207 291 181 280 164" fill="#5269b0"/>
      <path d="M272 181 L236 207" stroke="#2b3e46" stroke-width="12" stroke-linecap="round"/>
      <path d="M288 181 L330 201" stroke="#2b3e46" stroke-width="12" stroke-linecap="round"/>
      <path d="M276 222 L238 258" stroke="#2b3e46" stroke-width="13" stroke-linecap="round"/>
      <path d="M284 222 L330 256" stroke="#2b3e46" stroke-width="13" stroke-linecap="round"/>
    </g>

    <g id="resident-floor" opacity="0" transform="translate(15 13) rotate(82 280 244)">
      <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite" keyTimes="0;0.29;0.4;0.69;0.78;1" values="0;0;1;1;0;0"/>
      <ellipse cx="280" cy="134" rx="18" ry="21" fill="#6f4b3e"/>
      <circle cx="280" cy="142" r="20" fill="#b97862"/>
      <path d="M261 134 C266 113 292 111 300 133 C291 123 273 122 261 134" fill="#4b302b"/>
      <path d="M280 164 C270 181 270 207 280 224 C291 207 291 181 280 164" fill="#5269b0"/>
      <path d="M272 181 L237 211" stroke="#2b3e46" stroke-width="12" stroke-linecap="round"/>
      <path d="M288 181 L326 207" stroke="#2b3e46" stroke-width="12" stroke-linecap="round"/>
      <path d="M276 222 L238 260" stroke="#2b3e46" stroke-width="13" stroke-linecap="round"/>
      <path d="M284 222 L333 253" stroke="#2b3e46" stroke-width="13" stroke-linecap="round"/>
    </g>

    <g id="helper-lift" opacity="0">
      <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite" keyTimes="0;0.66;0.75;0.93;1" values="0;0;1;1;0"/>
      <g transform="translate(32 0)">
        <circle cx="354" cy="142" r="19" fill="#8a5b3f"/>
        <path d="M337 136 C344 114 370 116 374 138 C363 128 349 128 337 136" fill="#26343a"/>
        <path d="M354 164 C343 184 344 208 354 226 C366 208 366 184 354 164" fill="#2a7f76"/>
        <path d="M346 185 L309 215" stroke="#203a42" stroke-width="12" stroke-linecap="round"/>
        <path d="M361 186 L316 218" stroke="#203a42" stroke-width="11" stroke-linecap="round"/>
        <path d="M350 225 L326 268" stroke="#203a42" stroke-width="13" stroke-linecap="round"/>
        <path d="M359 225 L389 268" stroke="#203a42" stroke-width="13" stroke-linecap="round"/>
      </g>
      <g transform="translate(-6 -8) rotate(12 282 220)">
        <circle cx="286" cy="158" r="19" fill="#b97862"/>
        <path d="M268 151 C274 130 300 130 305 152 C295 143 279 143 268 151" fill="#4b302b"/>
        <path d="M286 181 C276 197 276 218 286 235 C297 218 297 197 286 181" fill="#5269b0"/>
        <path d="M278 198 L318 218" stroke="#2b3e46" stroke-width="11" stroke-linecap="round"/>
        <path d="M293 198 L329 216" stroke="#2b3e46" stroke-width="11" stroke-linecap="round"/>
        <path d="M283 235 L255 267" stroke="#2b3e46" stroke-width="13" stroke-linecap="round"/>
        <path d="M291 235 L323 267" stroke="#2b3e46" stroke-width="13" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <g id="event-card" filter="url(#soft-shadow)">
    <rect x="468" y="94" width="286" height="176" rx="18" fill="#ffffff" stroke="#dbe6e6"/>
    <circle cx="506" cy="132" r="15" fill="#e36f4d">
      <animate attributeName="r" dur="7.2s" repeatCount="indefinite" keyTimes="0;0.38;0.46;0.62;1" values="15;15;21;15;15"/>
      <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite" keyTimes="0;0.38;0.46;0.62;1" values="0.78;0.78;1;0.78;0.78"/>
    </circle>
    <text x="532" y="128" fill="#203a42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">possible_floor_stay</text>
    <text x="532" y="152" fill="#5a6f75" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">likely observed locally</text>

    <rect x="502" y="184" width="202" height="14" rx="7" fill="#dcebe7"/>
    <rect x="502" y="184" width="28" height="14" rx="7" fill="url(#care)">
      <animate attributeName="width" dur="7.2s" repeatCount="indefinite" keyTimes="0;0.34;0.57;0.92;1" values="28;28;202;202;28"/>
    </rect>

    <text x="502" y="226" fill="#365056" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">
      human review required
      <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite" keyTimes="0;0.55;0.62;1" values="1;1;0;0"/>
    </text>
    <text x="502" y="226" fill="#203a42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" opacity="0">
      Help is on the way
      <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite" keyTimes="0;0.55;0.64;0.93;1" values="0;0;1;1;0"/>
    </text>
    <path d="M504 242 h0" stroke="#2a7f76" stroke-width="8" stroke-linecap="round">
      <animate attributeName="d" dur="7.2s" repeatCount="indefinite" keyTimes="0;0.55;0.7;0.93;1" values="M504 242 h0;M504 242 h0;M504 242 h188;M504 242 h188;M504 242 h0"/>
    </path>
    <path d="M504 242 h188" stroke="#dae5e4" stroke-width="8" stroke-linecap="round"/>
  </g>

  <path d="M380 176 C432 126 438 118 468 126" fill="none" stroke="#2a7f76" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" dur="1.8s" repeatCount="indefinite" values="80;0"/>
  </path>

  <path d="M754 178 C798 128 824 120 850 154" fill="none" stroke="#5269b0" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" dur="1.6s" repeatCount="indefinite" values="88;0"/>
  </path>

  <g id="phone" filter="url(#soft-shadow)">
    <rect x="844" y="78" width="170" height="244" rx="28" fill="#203a42"/>
    <rect x="862" y="108" width="134" height="178" rx="18" fill="#f8fcfb"/>
    <circle cx="929" cy="304" r="7" fill="#71958d"/>
    <path d="M902 156 c18 -20 49 -20 67 0" fill="none" stroke="#2a7f76" stroke-width="8" stroke-linecap="round">
      <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite" keyTimes="0;0.55;0.62;0.75;0.92;1" values="0.25;0.25;1;0.45;1;0.25"/>
    </path>
    <path d="M886 134 c28 -32 86 -32 114 0" fill="none" stroke="#2a7f76" stroke-width="6" stroke-linecap="round" opacity="0.3">
      <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite" keyTimes="0;0.58;0.66;0.76;0.9;1" values="0.12;0.12;0.65;0.18;0.65;0.12"/>
    </path>

    <g id="phone-caregiver" opacity="0">
      <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite" keyTimes="0;0.56;0.64;0.92;1" values="0;0;1;1;0"/>
      <circle cx="929" cy="166" r="16" fill="#8a5b3f"/>
      <path d="M914 160 C919 144 940 144 944 161 C936 154 922 154 914 160" fill="#26343a"/>
      <path d="M929 184 L929 218" stroke="#2a7f76" stroke-width="11" stroke-linecap="round"/>
      <path d="M921 197 L900 215" stroke="#203a42" stroke-width="8" stroke-linecap="round"/>
      <path d="M937 197 L958 215" stroke="#203a42" stroke-width="8" stroke-linecap="round"/>
      <path d="M927 218 L912 244" stroke="#203a42" stroke-width="8" stroke-linecap="round"/>
      <path d="M932 218 L950 244" stroke="#203a42" stroke-width="8" stroke-linecap="round"/>
    </g>

    <rect x="884" y="244" width="92" height="24" rx="12" fill="#5269b0">
      <animate attributeName="fill" dur="7.2s" repeatCount="indefinite" keyTimes="0;0.56;0.68;0.84;1" values="#5269b0;#5269b0;#2a7f76;#5269b0;#5269b0"/>
    </rect>
  </g>

  <g id="call-label">
    <rect x="792" y="285" width="252" height="42" rx="21" fill="#ffffff" opacity="0.88" stroke="#dbe6e6"/>
    <text x="816" y="312" fill="#203a42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700">caregiver call request</text>
    <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite" keyTimes="0;0.55;0.7;0.92;1" values="0.42;0.42;1;1;0.42"/>
  </g>

  <g id="help-bubble" opacity="0">
    <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite" keyTimes="0;0.58;0.69;0.92;1" values="0;0;1;1;0"/>
    <rect x="836" y="36" width="210" height="42" rx="21" fill="#ffffff" stroke="#dbe6e6"/>
    <text x="860" y="63" fill="#203a42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700">Help is on the way</text>
  </g>

  <g opacity="0.72">
    <circle cx="1122" cy="65" r="7" fill="#2a7f76"/>
    <circle cx="1146" cy="65" r="7" fill="#5269b0"/>
    <circle cx="1170" cy="65" r="7" fill="#e36f4d"/>
  </g>
</svg>
