# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "CareSight Sprint 04/05 Camera and OBS Recon"
  slug: "caresight-sprint-04-05-camera-obs-recon"
  kind: existing_plan
  tranche: "Validate the supplied Sprint 04/05 plan, implement Sprint 04, implement Sprint 05, then run cross-sprint review and deterministic validation for Sprint 02 runtime handoff gates and Sprint 03 still-image visual cases."
  status: done
  oracle:
    signal: "npm run check plus targeted Python/CLI/browser/OBS-safe deterministic checks, sourced-image test records, no-send/no-call handoff receipts, and final sprint audit mapping all sprint items to evidence."
    cadence: "after each Worker package and at final audit"
    final_proof: "Final Judge/PM audit records full_outcome_complete: true with receipts for Sprint 04, Sprint 05, Sprint 02 FaceTime/OBS/TTS gates, Sprint 03 clothing/accessory/footwear image validation, docs updates, changed files, commands, and remaining blockers."
  intake:
    original_request: "Do sprint 04, sprint 05, then review sprint items including Sprint 02 FaceTime x OBS virtual camera/TTS and Sprint 03 image testing; proceed autonomously with detailed validation and no overnight FaceTime calling."
    interpreted_outcome: "CareSight has Sprint 04/05 work executed from the supplied plan and cross-sprint runtime/vision validation recorded with bounded local-first receipts."
    input_shape: existing_plan
    audience: "CareSight hackathon owner and local demo operator"
    authority: approved
    proof_type: test
    completion_proof: "All required sprint work is completed or precisely blocked with evidence; validation commands and artifacts are recorded; final audit proves the whole owner outcome rather than one slice."
    likely_misfire: "Treating plan creation, human-review waiting, or a single OBS fix as completion while Sprint 04/05 execution and Sprint 02/03 validation remain unproven."
    blind_spots_considered:
      - "OBS virtual camera may be blocked by macOS camera-extension permission rather than CareSight code."
      - "FaceTime can be prepared and no-call tested, but overnight live calling must not be engaged."
      - "Human review is an operator task; deterministic local work should proceed around it."
      - "Internet still images need source tracking and bounded claims for hats, outfits, tops, bottoms, shoes, and footwear."
      - "MJPEG/browser-feed may be demo-appropriate without being a production-video architecture claim."
    existing_plan_facts:
      - "Primary scope file: docs/superpowers/plans/2026-05-23-sprint-04-05-camera-obs-recon.md"
      - "Required order: Sprint 04, then Sprint 05, then cross-sprint review."
      - "Cross-sprint review must include Sprint 02 FaceTime x OBS virtual camera, TTS, and Sprint 03 still-image validation."
      - "Follow AGENTS.md CareSight safety, CLI, architecture, and Definition of Done rules."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/caresight-sprint-04-05-camera-obs-recon/"
    command: "npx goalbuddy board docs/goals/caresight-sprint-04-05-camera-obs-recon"

