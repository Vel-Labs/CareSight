      - "The harness would fake detections."
      - "Required metadata cannot be persisted or exposed cleanly."
    expected_output:
      - "CareSight-owned inference API."
      - "Raw Detection and normalized Observation types."
      - "Config-first model/camera/room metadata."
      - "Fail-closed error behavior."
    receipt:
