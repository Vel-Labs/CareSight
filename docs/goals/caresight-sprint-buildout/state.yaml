        - "apps/caresight-hub/caresight/runtime/inference/harness.py"
        - "apps/caresight-hub/caresight/runtime/inference/types.py"
        - "apps/caresight-hub/config/v0.local.json"
        - "apps/caresight-hub/scripts/yolo26_image_smoke.py"
        - "apps/caresight-hub/scripts/yolo26_webcam_smoke.py"
        - "apps/caresight-hub/tests/test_inference_harness.py"
        - "docs/architecture/ARCHITECTURE.md"
        - "docs/architecture/REPO_BOUNDARIES.md"
        - "docs/audits/2026-05-19-yolo26-inference-harness.md"
        - "docs/cli/COMMANDS.md"
      commands:
        - cmd: "npm run py:check"
          status: pass
        - cmd: "npm run check"
          status: pass
      summary: "Added CareSight-owned inference harness with fail-closed YOLO26 MLX adapter, raw Detection and normalized Observation types, config-first model/camera/room metadata, smoke-script wiring, deterministic tests, and docs/audit/changelog/decision notes. The harness does not fake detections; missing model/import/load/predict paths fail closed and empty YOLO results stay empty."
      remaining_blockers: []
      failed_attempts:
        - "npm run check failed before T016 because docs/FILE_TREE.md was stale and outside T005 allowed_files."
      recovery:
        - "T016 regenerated docs/FILE_TREE.md and passed npm run check."
      stopped_because: "Need files outside allowed_files to fix npm run check: docs/FILE_TREE.md is stale."

  - id: T006
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit Sprint 1 through Sprint 3 receipts and decide whether tracking and multi-room work is safe to start."
    inputs:
      - "T003 receipt"
      - "T004 receipt"
      - "T005 receipt"
      - "Current verification status"
    constraints:
      - "Read-only."
      - "Do not approve tracking work if blackbox event lifecycle remains unproven."
    expected_output:
      - "complete | not_complete for foundation tranche."
      - "Missing evidence."
      - "Next Worker allowed_files and verify commands for tracking if approved."
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "Foundation tranche is complete enough to start tracking. T003/T004 prove deterministic blackbox lifecycle and ReviewService safety boundaries; T005 proves the YOLO26 harness fail-closed path. T013/T015/T016 recovered scaffold verification, and npm run check passed after T016. Live-camera proof remains final/demo evidence, not a blocker for the next deterministic tracking slice."
      evidence:
        - "T003 receipt: v0 audit command, deterministic blackbox hardening, automation-reviewer rejection, npm run py:check pass, npm run check recovered by T013."
        - "T004 receipt: shared ReviewService proves reviewer requirement, status mutation, review/journal/handoff rows, audit reads, forbidden delete/dispatch, npm run check recovered by T015."
        - "T005 receipt: CareSight-owned YOLO26 inference harness with Detection/Observation separation, metadata, fail-closed behavior, deterministic tests, npm run check recovered by T016."
        - "Current fact: npm run check passed after T016; live-camera proof was not run and remains final/demo evidence."
      blocked_tasks: []
      missing_evidence:
