version: 2
goal:
  slug: caresight-sprint-buildout
  title: CareSight Sprint Buildout
  kind: existing_plan
  tranche: "Continuous execution: complete successive safe verified CareSight sprint slices until the blackbox live-loop foundation and approved downstream buildout are proven by receipts."
  status: done
  created_at: "2026-05-19"
  owner: PM
  pm_reasoning: high
  oracle:
    signal: "A real live-camera event plus deterministic test/audit chain proves CareSight observes locally, records blackbox evidence in SQLite, supports human review, journals outcomes, prepares handoff artifacts, and preserves safety boundaries."
    cadence: "after each Worker package and at final audit"
    final_proof: "Final Judge or PM receipt includes full_outcome_complete: true, exact commands, verification status, dirty diff summary, audit receipt paths, and no required Worker task remaining."
  intake:
    original_request: "Turn the CareSight sprint items into GoalBuddy and prepare safe rapid action with proven audit trail."
    interpreted_outcome: "Execute an auditable CareSight sprint buildout from v0 live-loop proof through review console, YOLO26 harness, tracking, v1 events, dashboard/journal/alerts, local multi-camera support, and constrained agent assistance."
    input_shape: existing_plan
    audience:
      - CareSight maintainers
      - hackathon judges
      - local caregivers evaluating the prototype
      - future coding agents
    authority: approved
    proof_type:
      - test
      - demo
      - artifact
      - review
    completion_proof: "Final Judge or PM audit receipt proves the current tranche is complete with live-loop evidence, verification commands, dirty diff summary, and no required Worker task remaining."
    likely_misfire: "Shipping docs or UI polish without proving the blackbox live loop, review authority, event policy reliability, and audit evidence."
    blind_spots_considered:
      - "Live data is required for delivered demo proof, but deterministic tests may use seeded data."
      - "Agents can help with summaries and drafts but cannot become the reviewer of record."
      - "Multi-camera narrative is useful, but must not weaken the v0 blackbox proof."
    existing_plan_facts:
      - "Sprint 1 closes the v0 live loop with real data and a detailed blackbox audit receipt."
      - "Sprint 2 builds review console behavior on the same service boundary as CLI wrappers."
      - "Sprint 3 wraps YOLO26 MLX behind a CareSight-owned inference harness."
      - "Sprint 4 adds track-aware floor-stay, missing-off-camera logic, severity scaling, and multi-room narrative."
      - "Sprint 5 adds deterministic v1 event policies for floor-stay, missing-off-camera, medication routine likely observed, and hydration routine likely observed."
      - "Sprint 6 evaluates segmentation only if it improves evidence or demo clarity without delaying v1."
      - "Sprint 7 builds dashboard, journal, Apple Notes-style logging, and text-to-FaceTime escalation artifacts."
      - "Sprint 8 supports practical local multi-camera configuration, ideally two local cameras with room labels and RTSP."
      - "Sprint 9 adds constrained agent/LLM assistance with provenance and forbidden-action tests."
  constraints:
    - "Preserve resident and caregiver safety."
    - "CareSight is not a medical device."
    - "Do not claim HIPAA compliance."
    - "Do not implement autonomous emergency dispatch."
    - "Do not confirm medication administration from vision alone."
    - "Do not identify a specific medication as taken."
    - "Do not add Ring/Nest/cloud camera integrations to hackathon core."
    - "Keep raw video local by default."
    - "Keep YOLO26 MLX as the vision lane."
    - "Keep LLM/agent layers constrained to summaries, drafts, audit, and handoff assistance."
    - "Agents must not confirm, dismiss, dispatch, diagnose, delete records, or become reviewer of record."
    - "SQLite is the unbiased blackbox source of truth."
    - "Scripts should be thin wrappers over focused runtime modules."
    - "Keep files below 350 lines where practical; files above 500 lines require extraction or written justification."
    - "Every supported CLI command must be documented in docs/cli/COMMANDS.md."
    - "Behavior changes require tests or deterministic checks where practical, docs, CHANGELOG.md, and DECISIONS.md for architecture changes."
    - "Delivered demo proof should use live data; seeded/synthetic data is only for deterministic tests and smoke checks."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/caresight-sprint-buildout/"
    command: "npx goalbuddy board /Users/steven/Workspace/40_Code/hackathons/CareSight/docs/goals/caresight-sprint-buildout"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: default
    objective: "Map current CareSight repo state against the sprint plan and identify the exact existing files, commands, and gaps for Sprint 1 through Sprint 3."
    inputs:
      - "AGENTS.md"
      - "README.md"
      - "ROADMAP.md"
      - "REPO_PROFILE.json"
      - "docs/project/PROJECT_BRIEF.md"
      - "docs/architecture/ARCHITECTURE.md"
      - "docs/architecture/REPO_BOUNDARIES.md"
      - "docs/roadmaps/CURRENT_STATE_AND_NEXT.md"
      - "docs/hackathon/hackathon_roadmap.md"
      - "contracts/README.md"
      - "docs/cli/COMMANDS.md"
      - "apps/caresight-hub/"
    constraints:
      - "Read-only."
      - "Do not run live camera commands."
      - "Do not edit implementation files."
      - "Preserve safety boundaries and blackbox SQLite framing."
    expected_output:
      - "Repo map for v0 live loop, review CLI/service, YOLO scripts, storage, tests, docs, and audit files."
      - "Exact current verification commands and whether they are deterministic or manual."
      - "Gap list for Sprint 1 through Sprint 3."
      - "Recommended largest safe first Worker slice with allowed_files and verify commands."
    receipt:
      result: done
      summary: "CareSight already has Sprint 1 and much of Sprint 2 implemented: v0 live loop, SQLite blackbox tables, review CLI, journal/handoff rows, docs, and deterministic tests. Sprint 3 remains the largest clean next slice: YOLO26 inference is still embedded in smoke/live scripts, not a CareSight-owned harness with Detection/Observation separation, metadata, and fail-closed API."
      evidence:
        - "docs/roadmaps/CURRENT_STATE_AND_NEXT.md: immediate next action is prove v0 review/acknowledgement loop after possible_floor_stay."
        - "docs/cli/COMMANDS.md: documents image smoke, webcam smoke, v0 live loop, review list/show/confirm/dismiss/journal with safety classes."
        - "apps/caresight-hub/scripts/v0_floor_stay_live.py: live command loads YOLO, AVFoundation camera, FloorStayDetector, snapshot, SQLite insert, event_persisted output."
        - "apps/caresight-hub/scripts/v0_review_events.py: CLI list/show are read-safe; confirm/dismiss require --reviewer and write review/journal/handoff."
        - "apps/caresight-hub/caresight/storage/sqlite_store.py and migrations/001_init.sql: blackbox tables include cameras, zones, event_policies, events, event_observations, event_reviews, journal_entries, agent_handoffs."
        - "apps/caresight-hub/caresight/events/floor_stay.py: emits possible_floor_stay with awaiting_human_confirmation and blocked autonomous emergency dispatch/medical diagnosis."
        - "apps/caresight-hub/caresight/vision/detections.py: only raw Detection dataclass exists; no Observation type found."
        - "apps/caresight-hub/config/v0.local.json: current single camera living_room, floor_zone, 8s dwell, local SQLite path."
        - "apps/caresight-hub/tests/test_v0_review_events.py: deterministic coverage for inbox filtering, summary, reviewer gate, confirm/dismiss status, journal, handoff, no emergency_dispatch command."
        - "package.json: verification scripts are validate:scaffold, validate:contracts, test:focused, test, typecheck, py:check, check."
      facts:
        - "Sprint 1 gap: live-data proof and detailed blackbox audit receipt are not current; deterministic tests exist, but PM/operator still needs real v0_floor_stay_live run evidence and SQLite inspection."
        - "Sprint 2 gap: review lifecycle exists in CLI/storage, but no shared runtime/review service boundary or dashboard/console path exists."
        - "Sprint 3 gap: no caresight/runtime/inference package found; YOLO model loading/result normalization lives in scripts, so Detection/Observation separation, config-first model metadata, and fail-closed harness are incomplete."
        - "Recommended largest safe first Worker slice: implement Sprint 3 CareSight-owned inference harness before broad UI/tracking."
      contradictions:
        - "docs/cli/COMMANDS.md marks YOLO26 Image Smoke as manual-operator even though it uses bundled image/model and appears deterministic-ish apart from local model/env availability."
        - "apps/caresight-hub/README.md says py:check is lightweight while current tests cover v0 config/events/storage/review behavior; wording is stale."
        - "Sprint 2 board objective says review console/service boundary, but current repo only has CLI plus SQLiteStore methods."
      ambiguity_requiring_judge:
        - "Whether first Worker should close Sprint 1 live audit proof with operator-run evidence, or build Sprint 3 harness first."
        - "Whether review service extraction should precede inference harness so CLI and future dashboard share one boundary."
        - "Whether yolo26_image_smoke.py should remain manual-operator or become agent-safe/manual-env after model availability is confirmed."

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the sprint sequence and choose the first safe implementation slice from the Scout evidence."
    inputs:
      - "T001 receipt"
      - "Goal constraints"
      - "Existing sprint plan facts"
    constraints:
      - "Read-only."
      - "Prefer live-loop closeout before broader architecture."
      - "Reject any slice that lets dashboard, agent, or LLM output become canonical truth."
    expected_output:
      - "Decision: approved | revise | blocked."
      - "First Worker objective."
      - "allowed_files."
      - "verify commands."
      - "stop_if conditions."
      - "Risks and audit evidence required."
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "Approve the sprint sequence with a correction to Scout priority: the first Worker slice must close or harden the v0 live-loop blackbox path before review UI, dashboard, agent, tracking, or YOLO26 harness expansion. Sprint 1 still lacks current live-data audit proof. T003 is the right boundary if it produces deterministic audit checks and operator-ready live proof artifacts without making dashboard, agent, or LLM output canonical truth."
      evidence:
        - "T001 receipt says Sprint 1 has deterministic tests but lacks current live-data proof and detailed blackbox audit receipt."
        - "Goal constraints make SQLite the unbiased blackbox source of truth and require local-first raw video defaults."
        - "Existing sprint plan says Sprint 1 closes the v0 live loop before review console, YOLO harness, tracking, dashboard, multi-camera, and agent assistance."
      blocked_tasks: []
      missing_evidence:
        - "Current operator-run live-camera event proof."
        - "SQLite inspection proving event, observation, review, journal, and handoff audit chain for the live event."
        - "Audit receipt tying commands, status, event_id, snapshot_path, reviewer, timestamps, and safety boundaries together."
      required_board_updates:
        - "Activate T003 with Judge-provided objective, allowed_files, verify, and stop_if."

  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Close or harden the v0 live-loop blackbox path so a real live-camera possible_floor_stay event can be observed locally, persisted in SQLite with snapshot_path/event_id/status/timestamps, reviewed by an authorized human through the existing CLI path, journaled, and handed off as an auditable artifact without any agent, dashboard, or LLM becoming canonical truth."
    allowed_files:
      - "apps/caresight-hub/caresight/storage/**"
      - "apps/caresight-hub/caresight/events/**"
      - "apps/caresight-hub/caresight/runtime/**"
      - "apps/caresight-hub/scripts/v0_floor_stay_live.py"
      - "apps/caresight-hub/scripts/v0_review_events.py"
      - "apps/caresight-hub/config/**"
      - "apps/caresight-hub/tests/**"
      - "docs/cli/COMMANDS.md"
      - "docs/audits/**"
      - "docs/roadmaps/CURRENT_STATE_AND_NEXT.md"
      - "CHANGELOG.md"
      - "DECISIONS.md"
    verify:
      - "npm run py:check"
      - "npm run check"
      - "manual/operator: run documented v0 live camera command only when hardware/operator is available"
      - "manual/operator: inspect SQLite rows for event_id, snapshot_path, observations, review, journal, handoff, reviewer, timestamps, and status"
    stop_if:
      - "Need files outside allowed_files."
      - "Need live camera proof and operator is unavailable; produce deterministic hardening plus exact operator checklist instead."
      - "The change would let agents, dashboard, LLM output, or scripts confirm, dismiss, dispatch, diagnose, delete, or become reviewer of record."
      - "The implementation would bypass SQLite blackbox records or make generated UI text canonical truth."
      - "The event wording claims medical-device behavior, HIPAA compliance, confirmed medication administration, diagnosis, or autonomous emergency response."
      - "Verification fails twice for the same unexplained reason."
      - "A file would exceed 500 lines without explicit written justification."
    expected_output:
      - "Changed files."
      - "Commands run with pass/fail status."
      - "Audit receipt path or clear reason it could not be produced."
      - "Remaining risks."
    receipt:
      result: done
      changed_files:
        - "apps/caresight-hub/caresight/storage/sqlite_store.py"
        - "apps/caresight-hub/scripts/v0_review_events.py"
        - "apps/caresight-hub/tests/test_v0_review_events.py"
        - "docs/cli/COMMANDS.md"
        - "docs/audits/2026-05-19-v0-live-loop-blackbox-hardening.md"
        - "docs/roadmaps/CURRENT_STATE_AND_NEXT.md"
        - "CHANGELOG.md"
        - "DECISIONS.md"
      commands:
        - cmd: "npm run py:check"
          status: pass
        - cmd: "npm run check"
          status: pass
      summary: "Implemented deterministic v0 blackbox hardening: read-only SQLite audit CLI, audit docs/checklist, reviewer/timestamp fields in report-only handoff payloads, and automation-reviewer rejection. Python verification and full check passed after T013 recovered the generated file tree."
      remaining_blockers: []
      missing_final_audit_evidence:
        - "Live camera proof and manual SQLite inspection require an available hardware/operator session."
      failed_attempts:
        - "npm run check failed before T013 because docs/FILE_TREE.md was stale and outside T003 allowed_files."
        - "Manual live-camera command was not run; operator/hardware live proof is deferred to final audit."
        - "Manual SQLite inspection for live event was not run; operator/hardware live proof is deferred to final audit."
      recovery:
        - "T013 regenerated docs/FILE_TREE.md and passed npm run check."
        - "T014 approved marking T003 done for deterministic hardening; live proof remains final-audit evidence, not a T003 blocker."
      stopped_because: "Need files outside allowed_files to fix npm run check: docs/FILE_TREE.md is stale."

  - id: T004
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Build or harden the shared review service boundary so CLI and future console buttons use the same confirm/dismiss/journal/handoff path."
    allowed_files:
      - "apps/caresight-hub/caresight/runtime/review/**"
      - "apps/caresight-hub/scripts/v0_review_events.py"
      - "apps/caresight-hub/tests/**"
      - "docs/cli/COMMANDS.md"
      - "docs/audits/**"
      - "CHANGELOG.md"
      - "DECISIONS.md"
    verify:
      - "npm run py:check"
      - "npm run check"
    stop_if:
      - "Existing repo shape uses different paths; ask PM to update allowed_files."
      - "Dashboard/UI files are required before the service boundary is clear."
      - "The implementation would bypass SQLite blackbox records."
      - "The implementation would allow agent confirmation/dismissal/deletion."
    expected_output:
      - "CLI and review service share one implementation path."
      - "Tests prove reviewer requirement, status update, journal row, handoff row, and forbidden actions."
      - "CLI docs updated."
    receipt:
      result: done
      changed_files:
        - "apps/caresight-hub/caresight/runtime/review/__init__.py"
        - "apps/caresight-hub/caresight/runtime/review/service.py"
        - "apps/caresight-hub/scripts/v0_review_events.py"
        - "apps/caresight-hub/tests/test_v0_review_events.py"
        - "docs/cli/COMMANDS.md"
        - "CHANGELOG.md"
        - "DECISIONS.md"
      commands:
