      - "Multi-camera work requires credentials or hardware unavailable to the Worker."
      - "Blackbox event lifecycle tests fail or are removed."
      - "ReviewService or SQLite canonical path is bypassed."
      - "Tracking or severity implies diagnosis or confirmed medication administration."
      - "Live camera or multi-camera hardware is required for deterministic completion."
      - "Files outside allowed_files are required."
    expected_output:
      - "Same-track dwell policy."
      - "Occlusion grace and reset tests."
      - "Dedupe/severity behavior."
      - "Missing-off-camera initial policy."
      - "Camera and room labels preserved in observations."
    receipt:
      result: done
      changed_files:
        - "apps/caresight-hub/caresight/events/floor_stay.py"
        - "apps/caresight-hub/caresight/events/missing_off_camera.py"
        - "apps/caresight-hub/caresight/runtime/config.py"
        - "apps/caresight-hub/caresight/runtime/tracking/__init__.py"
        - "apps/caresight-hub/caresight/runtime/tracking/state.py"
        - "apps/caresight-hub/caresight/storage/migrations/001_init.sql"
        - "apps/caresight-hub/caresight/storage/sqlite_store.py"
        - "apps/caresight-hub/config/v0.local.json"
        - "apps/caresight-hub/tests/test_floor_stay.py"
        - "apps/caresight-hub/tests/test_missing_off_camera.py"
        - "apps/caresight-hub/tests/test_sqlite_store.py"
        - "apps/caresight-hub/tests/test_tracking_state.py"
        - "contracts/examples/valid/missing-off-camera.event.json"
        - "contracts/examples/valid/possible-floor-stay.event.json"
        - "contracts/schemas/care-event.schema.json"
        - "tests/contracts/contract-corpus.test.ts"
        - "docs/audits/2026-05-19-tracking-foundation.md"
        - "docs/architecture/ARCHITECTURE.md"
        - "docs/architecture/REPO_BOUNDARIES.md"
        - "docs/cli/COMMANDS.md"
        - "docs/roadmaps/CURRENT_STATE_AND_NEXT.md"
        - "docs/FILE_TREE.md"
        - "CHANGELOG.md"
