          status: pass
        - cmd: "npm run check"
          status: pass
      summary: "Built the shared ReviewService boundary and routed the CLI through it for list/show/confirm/dismiss/journal/audit. Added tests for reviewer requirement, status mutation, review/journal/handoff rows, audit-chain reads, agent reviewer rejection, and forbidden delete/dispatch commands. Updated CLI docs, changelog, and decision record. Full check passed after T015 recovered the generated file tree."
      remaining_blockers: []
      failed_attempts:
        - "npm run check failed before T015 because docs/FILE_TREE.md was stale and outside T004 allowed_files."
      recovery:
        - "T015 regenerated docs/FILE_TREE.md and passed npm run check."
      stopped_because: "Need files outside allowed_files to fix npm run check: docs/FILE_TREE.md is stale."

  - id: T005
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Create the CareSight-owned YOLO26 MLX inference harness with Detection and Observation separation plus camera and room metadata."
    allowed_files:
      - "apps/caresight-hub/caresight/runtime/inference/**"
      - "apps/caresight-hub/config/**"
      - "apps/caresight-hub/scripts/yolo26_image_smoke.py"
