  - id: T007
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Implement track-aware floor-stay and missing-off-camera foundations with severity scaling and observation-level track metadata."
    allowed_files:
      - "apps/caresight-hub/caresight/runtime/tracking/**"
      - "apps/caresight-hub/caresight/events/**"
      - "apps/caresight-hub/caresight/storage/**"
