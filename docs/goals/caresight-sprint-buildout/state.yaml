  - id: T009
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: default
    objective: "Evaluate segmentation and local multi-camera feasibility without blocking the v1 event path."
    inputs:
      - "Current inference harness"
      - "YOLO26 MLX model assets"
      - "Current camera config"
      - "Network/local camera constraints"
    constraints:
      - "Read-only unless PM creates a Worker task."
      - "Do not add Ring/Nest/cloud provider scope."
      - "Do not run intrusive network discovery without operator approval."
    expected_output:
      - "Segmentation keep/defer/drop recommendation."
      - "RTSP/two-camera feasibility."
      - "ONVIF discovery feasibility and risks."
      - "Recommended Worker slice if feasible."
    receipt:
      result: done
      summary: "Segmentation is technically present upstream but should be deferred for v1 event path: current CareSight runtime consumes box detections only, has one webcam config, and v0/v1 docs explicitly say multi-camera comes after review loop proof. RTSP/two-camera is feasible as a bounded local Worker slice if it starts with config plus one optional RTSP source and no discovery. ONVIF discovery is feasible later but riskier because it implies LAN probing, credentials, and camera capability variance."
      evidence:
        - "apps/caresight-hub/config/v0.local.json defines a single living_room webcam source_uri=0 at 1280x720@30 with yolo26n.npz."
        - "apps/caresight-hub/scripts/v0_floor_stay_live.py opens only int(config.camera.source_uri) via cv2.VideoCapture(..., cv2.CAP_AVFOUNDATION)."
        - "apps/caresight-hub/caresight/runtime/inference/adapter.py parses result.boxes only and emits Detection records with bbox, class, confidence, camera_id, and timestamp."
        - "apps/caresight-hub/caresight/runtime/inference/types.py has BoundingBox/Detection/Observation types, but no mask or segmentation payload."
        - "contracts/schemas/camera-config.schema.json already allows source_type values webcam, continuity_camera, usb, rtsp, onvif, home_assistant."
        - "docs/architecture/camera_integration_strategy.md ranks RTSP as best local-home-camera direction and ONVIF as future local interoperability with implementation/capability-variation risks."
        - "apps/caresight-hub/vendor/yolo-mlx/GUIDE_SEGMENTATION.md documents yolo26n-seg MLX inference, but local models directory has only yolo26n.npz converted."
      facts:
        - "Segmentation recommendation: defer, not drop. Keep it as a later precision upgrade for zone/contact evidence after the box-based review loop is stable."
        - "RTSP feasibility: yes for a narrow local slice. OpenCV can generally read RTSP URI strings, and the camera contract already permits source_type=rtsp and string source_uri."
        - "Two-camera feasibility: feasible as sequential or low-rate multiplexing first, but current code assumes one camera config and one event loop."
        - "ONVIF feasibility: technically feasible as a discovery/config helper later, but not as v1 path work because discovery can scan the LAN, require credentials, and vary by device profile."
      contradictions:
        - "The camera contract already allows rtsp/onvif, but the current runtime config and live scripts implement only one webcam-style source."
        - "Upstream YOLO26 segmentation support and benchmarks exist, but the CareSight adapter/event schema path currently ignores masks and only stores boxes."
      ambiguity_requiring_judge:
        - "Whether the first multi-camera demo should run two active feeds or only support one active selected camera plus a disabled second camera config."
        - "Whether segmentation evidence should ever enter care-event contracts, or remain an internal policy signal summarized into existing box/zone observations."

