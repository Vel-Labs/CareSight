      - "Do not attempt unauthorized camera access or network scanning."
      - "Do not run live FaceTime, send iMessage, or play TTS without explicit operator approval."
      - "Default credential research must be framed as owner setup guidance, not a bypass path."
    expected_output:
      - "FaceTime/OBS virtual-camera failure modes and candidate fixes."
      - "TTS-to-FaceTime audio routing options and known caveats."
      - "Alternative demo paths to test, including OBS browser/MJPEG/Aitum/landscape/portrait options."
      - "Local camera/Tapo/RTSP setup assumptions, source-backed credential/config notes, and safe probe plan."
      - "Exact Worker package recommendation for resolution docs/tests."
    receipt:
      result: done
      summary: "Completed source-backed research for the Sprint 02 and Sprint 05 recovery lanes. The recommended path is to treat FaceTime visual bridging as optional and fragile, keep OBS as the local visual review/recording surface, use FaceTime primarily for operator-approved audio/TTS handoff, and require a redacted owner-authorized RTSP probe for any Tapo live-camera claim."
      evidence:
        - "OBS, Apple FaceTime, BlackHole, and TP-Link/Tapo source URLs recorded under sources."
        - "No live calls, sends, playback, camera probing, or network scanning performed during Scout research."
      sources:
        - "OBS virtual camera troubleshooting: https://obsproject.com/kb/virtual-camera-troubleshooting"
        - "OBS virtual camera guide: https://obsproject.com/kb/virtual-camera-guide"
        - "Apple FaceTime camera/microphone selection: https://support.apple.com/en-ae/guide/facetime/fctm26739220/mac"
        - "Apple FaceTime troubleshooting: https://support.apple.com/en-gb/102203"
        - "Apple FaceTime audio options: https://support.apple.com/en-gw/guide/facetime/fctme7c07113/mac"
        - "BlackHole audio loopback: https://github.com/ExistentialAudio/BlackHole"
        - "TP-Link Tapo RTSP/ONVIF FAQ: https://www.tp-link.com/us/support/faq/4465/"
        - "Tapo RTSP setup FAQ: https://www.tapo.com/us/faq/34/"
      face_time_obs_tts_findings:
        - "OBS says macOS 13+ with OBS 30+ uses the newer virtual camera component; OBS 29.1 and earlier are not compatible with macOS 14 virtual camera use."
        - "OBS virtual camera can output Program, Preview, one Scene, or one Source; CareSight should pin a known Scene or Source for tests instead of relying on whatever Program shows."
        - "Apple documents that FaceTime camera, microphone, and audio output must be selected from FaceTime's Video menu when multiple devices exist."
        - "Apple troubleshooting says to verify camera/microphone selection and test cameras in another app when FaceTime fails, so Photo Booth or another local app should be used before blaming CareSight."
        - "BlackHole supports app-to-app audio routing by setting the sending app output to BlackHole and the receiving app input to BlackHole; CareSight's TTS routing tests should verify both sides, not just WAV generation."
      camera_findings:
        - "TP-Link/Tapo source says most non-battery Tapo cameras support RTSP and ONVIF Profile S; C210/C210P2 are in the affected model list."
        - "Tapo RTSP requires a dedicated camera account created in the Tapo app, separate from the Tapo account login."
        - "Tapo documents stream1/stream2 RTSP URLs and default RTSP port 554; ONVIF service port is documented as 2020."
        - "Tapo recommends same local network/trusted local network use and warns against public-network exposure; CareSight should keep no-scan/no-port-forward rules."
      proposed_test_ladder:
        - "OBS visual: start detector with --obs-browser-feed, verify http://127.0.0.1:8766/live.html, run apps/obs-hub/tools/check_obs_live_feed.py, then select a fixed OBS virtual-camera Scene/Source if FaceTime visual proof is explicitly approved."
        - "FaceTime visual: before any call, verify OBS Virtual Camera in a non-call local app if possible, then in FaceTime's Video menu; if aspect ratio/stretch remains unreliable, keep OBS as visual surface and FaceTime as audio/TTS only."
        - "TTS audio: generate WAV without playback, switch sender output and FaceTime input to BlackHole, use FaceTime Wide Spectrum if needed for non-voice audio, then play only with explicit human approval."
        - "Tapo/camera: copy example to ignored local config, fill owner-authorized account/IP, run caresight_camera_probe.py, then run narrative only if a real event/frame receipt exists; otherwise record blocker class."

