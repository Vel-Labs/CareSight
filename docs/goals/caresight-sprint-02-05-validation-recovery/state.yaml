# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "CareSight Sprint 02-05 Validation Recovery"
  slug: "caresight-sprint-02-05-validation-recovery"
  kind: recovery
  tranche: "Recover the prior premature Sprint 02/03/04/05 completion claim by executing complexity-graded validation, camera proof, FaceTime/OBS/TTS resolution research, corrected docs, and a skeptical final audit."
  status: done
  oracle:
    signal: "Complexity-graded Sprint 03/04 result matrices, Sprint 05 end-to-end camera receipts, Sprint 02 researched/tested resolution ladder, updated docs/changelog/audits, npm run check, and final Judge receipt with full_outcome_complete true only if the corrected target is met."
    cadence: "after each Worker package and at final audit"
    final_proof: "Final Judge maps every user correction to concrete artifacts, commands, source-backed research, result summaries, remaining blockers, and fresh verification."
  intake:
    original_request: "Add my notes and your additional notes into a full update on what needs to happen next; make a new goal-prep."
    interpreted_outcome: "Create a new GoalBuddy recovery board that corrects the prior shallow completion claim and drives real validation/resolution work across Sprint 02/03/04/05."
    input_shape: recovery
    audience: "CareSight hackathon owner and future /goal PM"
    authority: approved
    proof_type: "test + source_backed_answer + artifact + review"
    completion_proof: "Repo-native receipts show complexity-graded validation and resolution attempts across 02/03/04/05, docs reflect corrected status, and final Judge accepts only with fresh verification."
    likely_misfire: "Calling the goal complete after another audit or source list without real runs, difficulty grading, resolution research, or corrected proof artifacts."
    blind_spots_considered:
      - "Using live-camera validation as a catch-all excuse would avoid deterministic Sprint 04 complexity testing."
      - "Using only category-level appearance examples would miss distance, body coverage, occlusion, quality, and multi-person cases."
      - "Researching default camera credentials must stay within owner-authorized setup guidance and never become unauthorized access or LAN scanning."
      - "FaceTime/OBS/TTS needs technical resolution research and alternatives, not another note that it is blocked."
      - "Downloaded test media must stay ignored/local or temporary; only source records and result summaries should be committed."
      - "Final status must distinguish implemented, tested, attempted, blocked, and production-validated."
    existing_plan_facts:
      - "Prior goal path: docs/goals/caresight-sprint-04-05-camera-obs-recon/goal.md"
      - "Prior final audit overclaimed deterministic/audit completion relative to the user's intended target."
      - "User explicitly requires expanded remaining plan before any new completion claim."
      - "CareSight AGENTS constraints remain binding."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 1
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/caresight-sprint-02-05-validation-recovery/"
    command: "npx goalbuddy board /Users/steven/Workspace/40_Code/hackathons/CareSight/docs/goals/caresight-sprint-02-05-validation-recovery"

