# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "CareSight Sprint 01/02 Production Validation"
  slug: "caresight-sprint-01-02-production-validation"
  kind: existing_plan
  tranche: "Production-readiness validation for Sprint 01 demo surfaces and Sprint 02 local agent/Hermes escalation behavior using seeded-real A/B cases."
  status: active
  oracle:
    signal: "The production validation checklist has ✅ status and linked proof artifacts for all required Sprint 01 and Sprint 02 gates, with passing verification and final audit full_outcome_complete: true."
    cadence: "after each Worker package and at final audit"
    final_proof: "docs/roadmaps/caresight_sprint_pack/09-sprint-01-02-production-validation.md has completed statuses, linked proof artifacts under docs/audits/production-validation/, human validation receipts where required, npm run check passes, and final Judge/PM audit approves production readiness for the current local prototype scope."
  intake:
    original_request: "Use GoalBuddy goal-prep with the Sprint 01/02 production validation checklist to build a detailed board; no shortcuts; sprint completion means production-ready operation, not fixtures or templates."
    interpreted_outcome: "Create an executable GoalBuddy board that drives Sprint 01 and Sprint 02 from implemented/staged surfaces to production-ready validation through seeded-real A/B evidence, real local integrations, human validation, and durable audit artifacts."
    input_shape: existing_plan
    audience: "CareSight operators, caregivers, future coding agents, and hackathon/product reviewers."
    authority: approved
    proof_type: "artifact + test + demo + review"
    completion_proof: "Checklist statuses are updated to ✅ with proof links, all required artifacts exist, human validations are captured, real local Gemma/Hermes/TTS/visual-handoff gates are proven or explicitly blocked, and final audit maps proof to the original outcome."
    likely_misfire: "Treating contracts, fake providers, templates, dry-run payloads, or existing historical proof as production-ready Sprint 01/02 completion."
    blind_spots_considered:
      - "Case B needs a real non-concerning seeded-real path or a defensible no-event proof."
      - "Gemma endpoint setup may require MLX/VLM serving work rather than simple config."
      - "Hermes may need workspace-local invocation plumbing rather than global install."
      - "External messaging, FaceTime, OBS/screen capture, and TTS require human approval and privacy checks."
      - "Execution-attempt logging must exist before real external action tests."
      - "Secrets and contact data must not be committed."
      - "Final production readiness cannot be claimed while any required live-human gate remains unvalidated."
    existing_plan_facts:
      - "Checklist source: docs/roadmaps/caresight_sprint_pack/09-sprint-01-02-production-validation.md."
      - "Case A seeded-real event: evt_d9aa38bdc636459c92ea4e25f665cd0d."
      - "Case B should be a non-concerning desk/normal-presence seeded-real case."
      - "Sprint 01 validation covers review packets, blackbox receipts, and human acceptance."
      - "Sprint 02 requirements cover local Gemma endpoint, real Gemma draft, Hermes invocation, allowlisted contacts, execution-attempt logging, screen/OBS, FaceTime handoff, and TTS."
      - "Sprint 02 validation covers Case A/Case B drafts, staging, Hermes dry-run, human-approved iMessage, visual handoff, TTS, and final acceptance."
      - "Do not stage a new live test until seeded-real A/B validation passes."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

