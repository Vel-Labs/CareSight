      - "Use goal_scout for read-only mapping tasks if spawning agents."
      - "Do not implement Sprint 01 in this task."
    expected_output:
      - "Parallel-plan result or PM fallback rationale."
      - "Receipts for read-only evidence mapping."
      - "Decision whether T002 has enough evidence to judge the first Worker slices."
    receipt:
      result: done
      summary: "Ran GoalBuddy update check, absolute-path parallel-plan, and three parallel read-only goal_scout agents for contracts, runtime/CLI, and sprint-boundary evidence. Scouts agree Sprint 01 is correctly scoped; Sprint 07 as a whole is too broad, but the blackbox-receipt and human-review-packet contract alignment is a suitable bounded checkpoint."
      evidence:
        - "parallel-plan: active PM task is not itself safe to parallelize, so PM used user-approved parallel goal_scout sidecars."
        - "Contract Scout: validator uses strict AJV 2020, schemaByName map, and exact corpus count test; new schemas require packages/core/src/validate-contracts.ts and tests/contracts/contract-corpus.test.ts updates."
        - "Contract Scout: only blackbox-receipt and human-review-packet are directly Sprint 01-supporting; full Sprint 07 agent/action/appearance/TTS schemas should be deferred."
        - "Runtime Scout: ReviewService.get_audit_chain(event_id) returns event, observations, reviews, journal_entries, and agent_handoffs and is the clean input for review-packet and blackbox-receipt."
        - "Runtime Scout: LiveProofAuditCollector already builds a blackbox-style read-only bundle and can inform receipt design."
        - "Boundary Scout: do not broaden Sprint 07 beyond Sprint 01 schemas before Worker execution; do not start Gemma/OpenClaw/Hermes."
      commands:
        - cmd: "node /Users/steven/.codex/plugins/cache/goalbuddy/goalbuddy/0.3.7/skills/goalbuddy/scripts/check-update.mjs --json"
          status: pass
        - cmd: "npx goalbuddy parallel-plan /Users/steven/Workspace/40_Code/hackathons/CareSight/docs/goals/caresight-sprint-01-demo-contracts --json"
          status: pass
