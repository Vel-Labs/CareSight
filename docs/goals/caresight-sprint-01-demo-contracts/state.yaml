# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "CareSight Sprint 01 Demo Surface and Contract Pack"
  slug: "caresight-sprint-01-demo-contracts"
  kind: existing_plan
  tranche: "Implement Sprint 01 Demo Surface Consolidation end to end, and fold in Sprint 07 contract JSON alignment only if Judge confirms it is quick, bounded, and directly supports Sprint 01/Sprint 02 boundaries."
  status: done
  oracle:
    signal: "`npm run check` passes, and `care_console.py review-packet` plus `care_console.py blackbox-receipt` produce schema-valid, SQLite-derived bounded outputs for `evt_d9aa38bdc636459c92ea4e25f665cd0d`."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipts show changed files, exact commands, passing verification, generated packet/receipt evidence, docs/changelog updates, and no safety-boundary drift."
  intake:
    original_request: "Goal-prep Sprint 01, possibly 07 as quick tack-on, review 00 as needed, and work agents in parallel."
    interpreted_outcome: "Prepare and execute a GoalBuddy-backed Sprint 01 implementation path with parallel read-only mapping and bounded Worker slices, using Sprint 07 contract alignment before Agent/LLM work if feasible."
    input_shape: existing_plan
    audience: "CareSight operators, future Codex agents, hackathon demo reviewers, and caregiver-aware product reviewers."
    authority: requested
    proof_type: test
    completion_proof: "Sprint 01 behavior is implemented, documented, and verified by concrete commands, including schema-valid review-packet and blackbox-receipt outputs for the proven live event."
    likely_misfire: "Completing only contracts/docs, or starting Agent/LLM drafting before the review-packet/receipt and contract boundaries are implemented and validated."
    blind_spots_considered:
      - "Contract JSON pack may need reconciliation with existing validator style before copy-in."
      - "Dashboard focused-mode changes may accidentally hide stale awaiting-review audit backlog."
      - "Receipt generation must not synthesize missing rows as success."
      - "CLI additions must be documented and agent-safe by default."
      - "Parallel Workers are only safe after disjoint write scopes are proven."
      - "docs/FILE_TREE.md may need regeneration for scaffold validation."
    existing_plan_facts:
      - "Recommended sprint order is 01 -> 07 -> 02 -> 03 -> 04 -> 05 -> 06 -> 08."
      - "Sprint 01 is demo surface consolidation."
      - "Sprint 07 is contract JSON pack alignment and may be folded in only if quick."
      - "00-master-codex-prompt.md is a boundary document to review as needed during execution."
      - "Do not start Gemma/OpenClaw/Hermes implementation in this tranche."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  parallel_agents_requested: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/caresight-sprint-01-demo-contracts/"
    command: "npx goalbuddy board docs/goals/caresight-sprint-01-demo-contracts"

active_task: null

tasks:
  - id: T001
    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: "Use GoalBuddy parallel planning to launch read-only evidence mapping for Sprint 01 and Sprint 07 feasibility."
    inputs:
      - "docs/goals/caresight-sprint-01-demo-contracts/goal.md"
      - "docs/goals/caresight-sprint-01-demo-contracts/state.yaml"
