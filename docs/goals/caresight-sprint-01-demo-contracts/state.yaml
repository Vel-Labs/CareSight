    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Decide the safest implementation sequence and whether Sprint 07 is a quick tack-on or a deferred follow-up."
    inputs:
      - "T001 receipt and Scout findings"
      - "Sprint 01 and Sprint 07 roadmap files"
      - "Current contract validator style and existing runtime/CLI surfaces"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Preserve CareSight safety boundaries and the 01 -> 07 -> 02 ordering."
      - "Pick the largest safe useful Worker slices with explicit allowed_files, verify commands, and stop conditions."
    expected_output:
      - "Decision: fold Sprint 07 into Sprint 01 contract slice, partially fold, or defer."
      - "Exact Worker objectives."
      - "Disjoint allowed_files if parallel Workers are safe."
      - "Verification commands."
      - "Stop conditions."
    receipt:
