version: 2

goal:
  title: "CareSight Sprint 02 Agent Assist"
  slug: "caresight-sprint-02-agent-assist"
  kind: existing_plan
  tranche: "Sprint 02: contracts first, fake provider first, validated local persistence, staged action requests only, CLI/docs, then source-backed local model recommendation."
  status: done
  oracle:
    signal: "Final Judge audit confirms Sprint 02 contracts, examples, fake-provider validation/persistence, staged-only action requests, CLI docs, and source-backed model recommendations are verified without forbidden CareSight claims or external execution."
    cadence: "after each Worker package and at final audit"
    final_proof: "Passing deterministic checks plus final audit receipt with full_outcome_complete: true."
  intake:
    original_request: "The next move is Sprint 02: contracts first, valid/invalid examples, fake provider, SQLite storage for validated/blocked drafts, staged-only action requests, CLI/docs, then Gemma MLX and TTS model selection for a 16 GB Mac mini."
    interpreted_outcome: "CareSight Hub gains a safe local-first agent-assist tranche with audited contracts and fake-provider behavior before any real Gemma/TTS provider decision."
    input_shape: existing_plan
    audience: "CareSight Hub demo operators, caregivers, and future coding agents."
    authority: requested
    proof_type: test
    completion_proof: "Contract/runtime/CLI checks pass, docs and changelog are updated, no external action execution exists, and model selection is source-backed after fake-provider proof."
    likely_misfire: "Shipping real LLM/TTS or action execution before fake-provider safety proof, or allowing drafts to make medical, HIPAA, emergency, or medication-confirmation claims."
    blind_spots_considered:
      - "Forbidden claims need to be canonical and enforced before generated caregiver-facing text exists."
      - "Blocked drafts must remain inspectable in SQLite without becoming confirmed caregiver messages."
      - "Action-request staging must not trigger external execution or dispatch."
      - "The CLI surface must remain documented in docs/cli/COMMANDS.md."
      - "Model selection must consider total system budget on a 16 GB RAM Mac mini, not model benchmarks alone."
    existing_plan_facts:
      - "Add Sprint 02 contracts first: agent-draft, agent-action-request, tts-utterance, forbidden-claim vocabulary."
      - "Add valid and invalid examples."
      - "Implement fake provider first."
      - "Store validated and blocked drafts in SQLite."
      - "Add action-request staging only, no external execution."
      - "Add CLI commands and docs."
      - "After fake provider passes, identify which Gemma MLX model is best fit."
      - "Consider mlx-community/gemma-4-e4b-it-4bit and mlx-community/gemma-4-e2b-it-4bit."
      - "Consider sentiuminc/holler-0.6b and sentiuminc/holler-0.6b-6bit for TTS."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

